name: Build apps

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'feat/**'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'js/**'
      - 'api/shell.php'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Download road graph
        run: node tools/graph/fetch-graph.mjs || echo "Sin grafo de carreteras publicado todavía"

      - name: Build web bundle and sync
        run: npm run sync:android

      - name: Write signing config
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=gasolinera"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/keystore.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/gasolinera-plus.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/gasolinera-plus-unsigned.apk
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gasolinera-plus.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync
        run: npm run sync:ios

      - name: Build for the iOS simulator (sin firmar)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
