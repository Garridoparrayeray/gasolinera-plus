name: Build apps

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'feat/**'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'js/**'
      - 'api/shell.php'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publicar la versión de package.json como release (crea la etiqueta vX.Y.Z)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con package.json (${version})" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Download road graph
        run: node tools/graph/fetch-graph.mjs || echo "Sin grafo de carreteras publicado todavía"

      - name: Download price index
        run: node tools/price-index/fetch-index.mjs || echo "Sin índice de precios publicado todavía"

      - name: Build web bundle and sync
        run: npm run sync:android

      - name: Write signing config
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=gasolinera"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/keystore.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (installable without a keystore)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/gasolinera-plus.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/gasolinera-plus-unsigned.apk
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/gasolinera-plus-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk

      - name: Publish the debug APK as a rolling pre-release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-debug > /dev/null 2>&1; then
            gh release create android-debug --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Android de prueba" \
              --notes "APK de prueba firmada con la clave de depuracion. Se instala directamente en el movil (hay que permitir instalar apps de origen desconocido). Se actualiza con cada cambio de las ramas feat/*."
          fi
          gh release upload android-debug dist/gasolinera-plus-debug.apk --clobber

      - name: Release notes from the changelog
        if: steps.release.outputs.tag != ''
        env:
          version: ${{ steps.release.outputs.version }}
        run: |
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "CHANGELOG.md no tiene la sección ## ${version}" >&2
            exit 1
          fi
          {
            echo ""
            echo "### Instalar"
            echo "Descarga \`gasolinera-plus.apk\` en el móvil Android y ábrelo. Si ya tienes la app, se instala encima y conserva tus datos."
          } >> dist/release-notes.md

      - name: Publish release
        if: steps.release.outputs.tag != '' && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gasolinera+ ${{ steps.release.outputs.tag }}
          body_path: dist/release-notes.md
          files: dist/gasolinera-plus.apk
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          fail_on_unmatched_files: true

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Download road graph
        run: node tools/graph/fetch-graph.mjs

      - name: Download price index
        run: node tools/price-index/fetch-index.mjs || echo "Sin índice de precios publicado todavía"

      - name: Build web bundle and sync
        run: npm run sync:ios

      - name: Build for the iOS simulator (sin firmar)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
