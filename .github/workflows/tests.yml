name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      BASE_URL: http://localhost:8021
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, mbstring

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download road graph
        continue-on-error: true
        run: node tools/graph/fetch-graph.mjs

      - name: Start local server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S localhost:8021 dev-router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8021/; then exit 0; fi
            sleep 1
          done
          echo "El servidor local no arranca"
          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      - name: Download the data of Portugal and France
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for C in pt fr; do
            mkdir -p "$RUNNER_TEMP/$C"
            gh release download "data-$C" -p "gasolinera-$C.sqlite.gz" -D "$RUNNER_TEMP/$C"
            gunzip -c "$RUNNER_TEMP/$C/gasolinera-$C.sqlite.gz" > "data/gasolinera-$C.sqlite"
            gh release download "data-$C" -p "stations-lite-$C.json" -D data --clobber
          done
          ls -la data

      - name: Static checks
        run: python tests/static-checks.py

      - name: Unit tests (hours, time zones)
        run: |
          node tests/osm-hours.test.mjs
          php tests/timezone-test.php
          php tests/opening-hours-test.php

      - name: API smoke tests
        run: python tests/api-smoke.py

      - name: Search order
        run: php tests/search-order-test.php

      - name: Regenerate offline JSON from the database
        run: php scripts/build-database.php --mode=lite

      - name: JS and PHP parity
        run: node tests/api-parity.mjs

      - name: UI battery
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-battery.mjs

      - name: UI garaje
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-garage.mjs

      - name: UI paises, carburantes y horarios
        env:
          CHROME_PATH: google-chrome
        run: |
          node tests/ui-countries.mjs
          node tests/ui-countries-deep.mjs
          node tests/ui-fuels-hours.mjs
          node tests/ui-garage-countries.mjs

      - name: UI Bluetooth
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-bluetooth.mjs

      - name: UI rutas
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-route.mjs

      - name: UI mapas sin conexion (como en la app)
        env:
          CHROME_PATH: google-chrome
          BASE_URL: http://localhost:8022
        run: |
          GP_NATIVE=1 PHP_CLI_SERVER_WORKERS=4 php -S localhost:8022 dev-router.php > "$RUNNER_TEMP/php-native.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8022/; then break; fi
            sleep 1
          done
          node tests/ui-maps.mjs

      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/php-server.log" || true
