name: Tests

on:
  push:
    branches-ignore:
      - main
  pull_request: {}
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      BASE_URL: http://localhost:8021
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, mbstring

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Start local server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S localhost:8021 dev-router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8021/; then exit 0; fi
            sleep 1
          done
          echo "El servidor local no arranca"
          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      - name: Static checks
        run: python tests/static-checks.py

      - name: API smoke tests
        run: python tests/api-smoke.py

      - name: UI battery
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-battery.mjs

      - name: UI garaje
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-garage.mjs

      - name: UI rutas
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-route.mjs

      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/php-server.log" || true
