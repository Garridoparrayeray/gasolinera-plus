name: Clean unused Vercel deployments

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clean-vercel.yml'
      - 'scripts/clean-vercel.mjs'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Vercel cleanup script
        env:
          VERCEL_TOKEN: ${{ secrets.TOKEN_GASOLINERA }}
          VERCEL_ORG_ID: ${{ secrets.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: node scripts/clean-vercel.mjs
