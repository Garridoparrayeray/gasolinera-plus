name: Road graph

on:
  schedule:
    - cron: '0 4 2 * *'
  push:
    branches:
      - 'feat/**'
    paths:
      - 'tools/graph/**'
      - '.github/workflows/road-graph.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, windows, osm]
    timeout-minutes: 300
    defaults:
      run:
        shell: C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download OpenStreetMap extracts (Geofabrik)
        run: |
          mkdir -p "$RUNNER_TEMP/osm"
          curl -sSfL -o "$RUNNER_TEMP/osm/spain.osm.pbf" https://download.geofabrik.de/europe/spain-latest.osm.pbf
          curl -sSfL -o "$RUNNER_TEMP/osm/canarias.osm.pbf" https://download.geofabrik.de/africa/canary-islands-latest.osm.pbf
          curl -sSfL -o "$RUNNER_TEMP/osm/portugal.osm.pbf" https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          curl -sSfL -o "$RUNNER_TEMP/osm/france.osm.pbf" https://download.geofabrik.de/europe/france-latest.osm.pbf
          ls -la "$RUNNER_TEMP/osm"

      - name: Build road graph and places
        run: |
          node --max-old-space-size=65536 tools/graph/build-graph.mjs \
            --out "$RUNNER_TEMP/road-graph" --stations data/stations-lite.json \
            --country es "$RUNNER_TEMP/osm/spain.osm.pbf" "$RUNNER_TEMP/osm/canarias.osm.pbf" \
            --country pt "$RUNNER_TEMP/osm/portugal.osm.pbf" \
            --country fr "$RUNNER_TEMP/osm/france.osm.pbf"
          cat "$RUNNER_TEMP/road-graph/build-stats.json"

      - name: Check the graph with reference routes
        env:
          GRAPH_DIR: ${{ runner.temp }}/road-graph
        run: node --max-old-space-size=16384 tests/router.test.mjs

      - name: Refresh station brands and opening hours from OpenStreetMap
        id: osm
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/osm-data"
          for CC in fr pt; do
            ISO=$(echo "$CC" | tr '[:lower:]' '[:upper:]')
            curl -sSfL -o "$RUNNER_TEMP/osm-data/stations-lite-$CC.json" "https://github.com/$GITHUB_REPOSITORY/releases/download/data-$CC/stations-lite-$CC.json" || continue
            QUERY="[out:json][timeout:300];area[\"ISO3166-1\"=\"$ISO\"][admin_level=2]->.a;nwr[\"amenity\"=\"fuel\"](area.a);out center tags;"
            GOT=0
            for url in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              if curl -sS -m 600 -H "Accept: application/json" -H "User-Agent: GasolineraPlus (+https://gasolineraplus.vercel.app)" --data-urlencode "data=$QUERY" "$url" -o "$RUNNER_TEMP/osm-data/overpass-$CC.json" && head -c 1 "$RUNNER_TEMP/osm-data/overpass-$CC.json" | grep -q '{'; then
                GOT=1
                break
              fi
              echo "::notice::Overpass no respondió en $url ($CC)"
            done
            if [ "$GOT" = "1" ]; then
              node tools/osm/build-osm.mjs "$RUNNER_TEMP/osm-data/overpass-$CC.json" "$RUNNER_TEMP/osm-data/stations-lite-$CC.json" "$RUNNER_TEMP/osm-data/osm-$CC.json" && echo "ready-$CC=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Publish French OSM data
        if: steps.osm.outputs.ready-fr == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: data-fr
          files: ${{ runner.temp }}/osm-data/osm-fr.json
          make_latest: false

      - name: Publish Portuguese OSM data
        if: steps.osm.outputs.ready-pt == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: data-pt
          files: ${{ runner.temp }}/osm-data/osm-pt.json
          make_latest: false

      - name: Pack
        run: |
          rm -f "$RUNNER_TEMP/road-graph/build-stats.json"
          tar --force-local -czf road-graph.tar.gz -C "$RUNNER_TEMP/road-graph" .
          ls -la road-graph.tar.gz

      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: road-graph
          name: Grafo de carreteras (OpenStreetMap)
          body: Red viaria de España, Canarias, Portugal y Francia para el motor de rutas de Gasolinera+, generada a partir de OpenStreetMap (© OpenStreetMap contributors, ODbL). Se regenera cada mes.
          files: road-graph.tar.gz
          make_latest: false
          prerelease: false

      - name: Publish test release asset
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: road-graph-test
          name: Grafo de carreteras de prueba (OpenStreetMap)
          body: Red viaria de España, Canarias, Portugal y Francia para el motor de rutas de Gasolinera+, generada a partir de OpenStreetMap (© OpenStreetMap contributors, ODbL). Se regenera cada mes.
          files: road-graph.tar.gz
          make_latest: false
          prerelease: true
