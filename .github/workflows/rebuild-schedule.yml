name: Rebuild schedule data

on:
  schedule:
    # Respaldo: las cuatro actualizaciones diarias (03:00, 09:00, 15:00 y 21:00, hora de Madrid) las lanza un servicio
    # externo con workflow_dispatch. Estas ejecuciones llegan con hasta unas 5 horas de retraso y solo importan si no
    # hay ninguna foto de precios de las ultimas 6 horas.
    - cron: '17 3 * * *'
    - cron: '41 5 * * *'
    - cron: '13 7 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Descargar y desplegar aunque ya este el snapshot de hoy'
        type: boolean
        default: false
      preview:
        description: 'Desplegar como preview (sin tocar produccion)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        country: [es, pt, fr]
    env:
      C: ${{ matrix.country }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, mbstring

      - name: Download yesterday's database
        run: |
          DB=$(python3 -c "import json; print(json.load(open('config/countries.json'))['$C']['db'])")
          LITE=$(python3 -c "import json; print(json.load(open('config/countries.json'))['$C']['lite'])")
          echo "DB=$DB" >> "$GITHUB_ENV"
          echo "LITE=$LITE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/prev"
          if [ "$C" = "fr" ] || [ "$C" = "pt" ]; then
            gh release download "data-$C" -p "osm-$C.json" -D data --clobber || echo "::notice::Sin datos nuevos de OSM para $C; se usan los del repositorio"
          fi
          if gh release download "data-$C" -p "gasolinera-$C.sqlite.gz" -D "$RUNNER_TEMP/prev"; then
            gunzip -c "$RUNNER_TEMP/prev/gasolinera-$C.sqlite.gz" > "$DB"
            echo "Base de ayer descargada de la release data-$C"
          elif [ -f "$DB" ]; then
            echo "::notice::No hay release data-$C todavía; se parte de la base del repositorio"
          else
            echo "::notice::No hay base previa de $C; se crea desde cero"
          fi

      - name: Skip if the published snapshot is recent
        id: check
        run: |
          # Los precios cambian durante el dia: se vuelve a importar en cada ejecucion, salvo que la foto publicada
          # sea reciente: menos de 90 minutos (por ejemplo, un push justo despues de otra ejecucion) o, si es una
          # ejecucion programada de GitHub (solo respaldo del servicio externo), menos de 6 horas.
          LIMIT=90
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            LIMIT=360
          fi
          AGE=$(python3 - <<PY
          import sqlite3
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          try:
              row = sqlite3.connect('$DB').execute("SELECT value FROM meta WHERE key = 'source_updated_at'").fetchone()
              taken = datetime.strptime(row[0], '%d/%m/%Y %H:%M:%S').replace(tzinfo=ZoneInfo('Europe/Madrid'))
              print(int((datetime.now(timezone.utc) - taken).total_seconds() // 60))
          except Exception:
              print(100000)
          PY
          )
          echo "$C · minutos desde la ultima foto: $AGE"
          if [ "$AGE" -lt "$LIMIT" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and check today's prices
        if: steps.check.outputs.skip != 'true'
        run: php scripts/build-database.php --mode=daily --country="$C"

      - name: Publish to the release
        if: steps.check.outputs.skip != 'true'
        run: |
          if ! gh release view "data-$C" > /dev/null 2>&1; then
            gh release create "data-$C" --target "$GITHUB_SHA" --latest=false \
              --title "Precios del día ($C)" \
              --notes "Base de datos diaria de precios de carburantes de Gasolinera+ para '$C'. La genera el workflow Rebuild schedule data; el despliegue y la app usan siempre la última que pasó las comprobaciones."
          fi
          if [ -f "$RUNNER_TEMP/prev/gasolinera-$C.sqlite.gz" ]; then
            cp "$RUNNER_TEMP/prev/gasolinera-$C.sqlite.gz" "$RUNNER_TEMP/gasolinera-$C-anterior.sqlite.gz"
            gh release upload "data-$C" "$RUNNER_TEMP/gasolinera-$C-anterior.sqlite.gz" --clobber
          fi
          gzip -9 -c "$DB" > "$RUNNER_TEMP/gasolinera-$C.sqlite.gz"
          gh release upload "data-$C" "$RUNNER_TEMP/gasolinera-$C.sqlite.gz" "$LITE" --clobber
          echo "published" > "$RUNNER_TEMP/published.txt"

      - name: Mark as published
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: published-${{ matrix.country }}
          path: ${{ runner.temp }}/published.txt
          retention-days: 1

  deploy:
    needs: data
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Decide whether to deploy
        id: check
        run: |
          PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("published-"))] | length')
          echo "Países con datos nuevos: $PUBLISHED"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ] || [ "$PUBLISHED" != "0" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nada nuevo que desplegar"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.deploy == 'true'
        with:
          submodules: false

      - uses: actions/setup-node@v7
        if: steps.check.outputs.deploy == 'true'
        with:
          node-version: '22'

      - name: Download the latest good data of each country
        if: steps.check.outputs.deploy == 'true'
        run: |
          for C in es pt fr; do
            DB=$(python3 -c "import json; print(json.load(open('config/countries.json'))['$C']['db'])")
            LITE=$(python3 -c "import json; print(json.load(open('config/countries.json'))['$C']['lite'])")
            mkdir -p "$RUNNER_TEMP/$C"
            if gh release download "data-$C" -p "gasolinera-$C.sqlite.gz" -p "$(basename "$LITE")" -D "$RUNNER_TEMP/$C"; then
              gunzip -c "$RUNNER_TEMP/$C/gasolinera-$C.sqlite.gz" > "$DB"
              cp "$RUNNER_TEMP/$C/$(basename "$LITE")" "$LITE"
              echo "$C: datos de la release"
            elif [ -f "$DB" ]; then
              echo "::warning::$C: no hay release; se despliega la base del repositorio"
            else
              echo "::warning::$C: sin datos todavía; la app lo mostrará como próximamente"
            fi
          done

      - name: Slim the databases to fit in the function
        if: steps.check.outputs.deploy == 'true'
        run: python3 scripts/slim-database.py data/gasolinera.sqlite data/gasolinera-pt.sqlite data/gasolinera-fr.sqlite

      - name: Warn about old data
        if: steps.check.outputs.deploy == 'true'
        run: |
          python3 - <<'EOF'
          import json, datetime, os
          today = datetime.date.today()
          for code, country in json.load(open('config/countries.json')).items():
              path = country['lite']
              if not os.path.exists(path):
                  continue
              date = json.load(open(path)).get('snapshotDate', '')
              if not date:
                  continue
              age = (today - datetime.date.fromisoformat(date)).days
              print(f'{code}: datos del {date} ({age} días)')
              if age >= 2:
                  print(f'::warning::{code}: los precios llevan {age} días sin actualizarse')
          EOF

      - name: Download road graph
        if: steps.check.outputs.deploy == 'true'
        run: |
          TAG=road-graph
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            TAG=road-graph-test
          fi
          ROAD_GRAPH_TAG=$TAG node tools/graph/fetch-graph.mjs

      - name: Install Vercel CLI
        if: steps.check.outputs.deploy == 'true'
        run: npm install --global vercel@latest

      - name: Deploy preview
        if: steps.check.outputs.deploy == 'true' && (inputs.preview || github.ref != 'refs/heads/main')
        env:
          VERCEL_ORG_ID: ${{ secrets.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          URL=$(vercel deploy --yes --token="${{ secrets.TOKEN_GASOLINERA }}")
          echo "Preview: $URL"
          echo "### Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to production
        if: steps.check.outputs.deploy == 'true' && !inputs.preview && github.ref == 'refs/heads/main'
        env:
          VERCEL_ORG_ID: ${{ secrets.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: vercel deploy --prod --yes --token="${{ secrets.TOKEN_GASOLINERA }}"

      - name: Check that production answers
        if: steps.check.outputs.deploy == 'true' && !inputs.preview && github.ref == 'refs/heads/main'
        run: |
          FAILED=0
          for P in "/api/stats/national" "/api/stations/near?lat=43.33&lon=-3.0&radius=5&fuel=gasolina_95_e5" "/api/stats/national?pais=pt" "/api/stats/national?pais=fr" "/" "/gasolineras"; do
            CODE=000
            for TRY in 1 2 3; do
              CODE=$(curl -s -o /tmp/answer.txt -w '%{http_code}' "https://gasolineraplus.vercel.app$P" || true)
              if [ "$CODE" = "200" ]; then
                break
              fi
              sleep 15
            done
            echo "$P -> $CODE"
            head -c 200 /tmp/answer.txt; echo
            if [ "$CODE" != "200" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::Produccion no responde tras el despliegue"
            exit 1
          fi

      - name: Clean up old deployments to save Vercel storage
        if: steps.check.outputs.deploy == 'true' && !inputs.preview && github.ref == 'refs/heads/main'
        env:
          VERCEL_ORG_ID: ${{ secrets.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: vercel rm gasolineraplus --safe --yes --token="${{ secrets.TOKEN_GASOLINERA }}" || true
