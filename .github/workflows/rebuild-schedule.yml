name: Rebuild schedule data

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, mbstring

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Add today's snapshot to gasolinera.sqlite
        if: github.event_name != 'push'
        run: php scripts/build-database.php --mode=daily

      - name: Commit updated database and JSON
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet data/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/gasolinera.sqlite data/stations-lite.json
            git commit -m "chore: snapshot diario de precios y json offline [skip ci]"
            git push
          else
            echo "Datos inalterados, nothing to commit"
          fi

      - name: Download road graph
        run: node tools/graph/fetch-graph.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ secrets.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: vercel deploy --prod --yes --token="${{ secrets.TOKEN_GASOLINERA }}"

      - name: Clean up old deployments to save Vercel storage
        env:
          VERCEL_ORG_ID: ${{ secrets.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: vercel rm gasolineraplus --safe --yes --token="${{ secrets.TOKEN_GASOLINERA }}" || true
